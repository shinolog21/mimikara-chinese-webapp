<style>
:root{--paper:#F2F2EA;--card:#FBFAF3;--ink:#20241F;--ink2:#5F6458;--line:#DBDACB;--blue:#2C4A9A;--blue-deep:#22376E;--blue-soft:#E7EBF6;--red:#BE3A1D;--red-soft:#F6E7E1;--green:#3F7A50;--green-soft:#E5EFE7;--mask:#E9E8DB;--radius:14px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Zen Kaku Gothic New',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.65}
.zh{font-family:'Noto Serif SC','Shippori Mincho B1',serif}
header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.hd-title{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:1.12rem;letter-spacing:.04em}
.hd-title .accent{color:var(--red)}
.hd-sub{font-size:.66rem;color:var(--ink2);letter-spacing:.06em}
.rate-wrap{display:flex;align-items:center;gap:6px}
.rate-wrap label{font-size:.68rem;color:var(--ink2)}
select,input[type=text]{font-family:inherit;font-size:.86rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
textarea{font-family:inherit;font-size:.9rem;color:var(--ink);background:#FDFCF7;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:80px;resize:vertical;line-height:1.7}
textarea:focus,input:focus{border-color:var(--blue);outline:none}
main{max-width:640px;margin:0 auto;padding:16px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card h2{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:1rem;letter-spacing:.03em;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .tag{font-weight:700;font-size:.62rem;color:var(--blue);background:var(--blue-soft);border-radius:999px;padding:2px 8px;font-family:'Zen Kaku Gothic New',sans-serif}
.muted{color:var(--ink2);font-size:.8rem}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--blue);color:#fff;font-weight:700;font-size:.9rem;border-radius:12px;padding:12px 18px}
.btn:active{background:var(--blue-deep)}
.btn.ghost{background:var(--card);color:var(--blue);border:1.5px solid var(--blue)}
.btn.quiet{background:var(--card);color:var(--ink2);border:1px solid var(--line);font-weight:500}
.btn.red{background:var(--red)}
.btn.wide{width:100%}
.btn.sm{padding:7px 12px;font-size:.78rem;border-radius:9px}
.btn:disabled{opacity:.4;cursor:default}
.icon-play{width:0;height:0;border-left:9px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent;display:inline-block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}
.row.between{justify-content:space-between}
.mt8{margin-top:8px}.mt12{margin-top:12px}
.seg{display:flex;background:var(--mask);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:.82rem;font-weight:700;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--blue);box-shadow:0 1px 3px rgba(32,36,31,.12)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stat .n{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:1.35rem;color:var(--blue)}
.stat.due .n{color:var(--red)}
.stat .l{font-size:.64rem;color:var(--ink2);font-weight:700}
.tzg-wrap{display:flex;justify-content:center;margin:8px 0 4px}
.tzg{position:relative;width:min(60vw,220px);height:min(60vw,220px);border:2px solid var(--ink);border-radius:6px;background:#FDFCF7;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px}
.tzg::before,.tzg::after{content:'';position:absolute;pointer-events:none}
.tzg::before{left:0;right:0;top:50%;border-top:1.5px dashed #D8D6C2}
.tzg::after{top:0;bottom:0;left:50%;border-left:1.5px dashed #D8D6C2}
.tzg .big{position:relative;z-index:1;font-size:clamp(36px,11vw,58px);font-weight:700;line-height:1.25}
.tzg .front-ja{position:relative;z-index:1;font-size:1.02rem;font-weight:700;line-height:1.5}
.tzg .hidden-mark{position:relative;z-index:1;font-size:2rem;color:#C9C7B4;font-family:'Shippori Mincho B1',serif}
.pinyin{color:var(--blue);font-weight:500;font-size:1rem}
.meaning{font-size:.92rem;font-weight:700}
.card-answer{text-align:center;min-height:56px;margin-top:6px}
.rate4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}
.rate4 button{border-radius:11px;padding:10px 2px;font-weight:700;font-size:.8rem;border:1.5px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:1px;align-items:center}
.rate4 .iv{font-size:.62rem;font-weight:500;color:var(--ink2)}
.rate4 .r-again{color:var(--red);border-color:var(--red)}
.rate4 .r-easy{color:var(--green);border-color:var(--green)}
.rate4 .r-good{color:var(--blue);border-color:var(--blue)}
.badge{font-size:.64rem;font-weight:700;border-radius:999px;padding:2px 9px}
.b-new{color:var(--green);background:var(--green-soft)}
.b-rev{color:var(--blue);background:var(--blue-soft)}
.b-store{color:var(--ink2);background:var(--mask)}
.progress{font-size:.74rem;color:var(--ink2);text-align:center;margin-top:8px;letter-spacing:.06em}
.done{background:linear-gradient(160deg,#FBFAF3 60%,#EFF1E9);border:1px solid var(--line);border-radius:var(--radius);padding:26px 18px;text-align:center}
.done .zh-big{font-family:'Noto Serif SC',serif;font-size:2rem;font-weight:700;color:var(--blue)}
.list-item{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px dashed var(--line);font-size:.88rem}
.list-item:first-of-type{border-top:none}
.list-item .h{font-weight:700;min-width:70px}
.list-item .p{color:var(--blue);font-size:.78rem;min-width:86px}
.list-item .m{color:var(--ink2);font-size:.8rem;flex:1}
.note{font-size:.74rem;color:var(--ink2);background:var(--mask);border-radius:10px;padding:9px 12px;margin-top:10px}
.err-box{background:var(--red-soft);border:1px solid var(--red);color:var(--red);border-radius:10px;padding:10px 14px;font-size:.8rem;font-weight:700;margin-top:10px}
.diff{font-size:1.7rem;font-weight:700;line-height:1.7;text-align:center;letter-spacing:.06em}
.diff .ok{color:var(--green)}
.diff .ng{color:var(--red);background:var(--red-soft);border-radius:5px}
.scoreline{text-align:center;font-weight:800;font-family:'Shippori Mincho B1',serif;font-size:1.2rem;margin-top:8px}
.heard{text-align:center;font-size:.92rem;color:var(--ink2);margin-top:6px}
.rec-btn{width:88px;height:88px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;font-size:.86rem;display:flex;align-items:center;justify-content:center;margin:14px auto 4px;box-shadow:0 3px 10px rgba(190,58,29,.3)}
.rec-btn.listening{background:var(--ink);animation:pulse 1.2s ease infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.rec-btn.listening{animation:none}}
</style>
</head>

<header>
  <div>
    <div class="hd-title">単語<span class="accent">道場</span></div>
    <div class="hd-sub">SRS単語帳+発音チェック</div>
  </div>
  <div class="rate-wrap"><label for="rate">速度</label>
    <select id="rate"><option value="0.7">0.7x</option><option value="0.85" selected>0.85x</option><option value="1">1.0x</option><option value="1.15">1.15x</option></select>

<div id="tab-pron"></div>

/* ============ TTS ============ */
let RATE=0.85,zhVoice=null,curU=null;
const hasTTS=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
function pickVoice(){if(!hasTTS)return;const vs=speechSynthesis.getVoices();const zh=vs.filter(v=>v.lang&&v.lang.toLowerCase().replace('_','-').indexOf('zh')===0);zhVoice=zh.find(v=>/cn|hans|mandarin|普通|中文|台/i.test(v.lang+' '+v.name))||zh[0]||null;}
if(hasTTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speakTTS(t,opt){opt=opt||{};if(!hasTTS)return;stopVoice();setTimeout(()=>{const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';if(zhVoice)u.voice=zhVoice;u.rate=opt.rate||RATE;curU=u;speechSynthesis.speak(u);},60);}
/* ============ 録音した声(2026-11-24・E の声。mini のローカル AI で前もって作った audio/zh/) ============
   目録(audio/zh/index.json)にある文は録音を流し、無い文(会話の返事など)は今まで通り端末の声で読む。
   速さは、録音そのままの速さを既定(0.85)に当てる(0.7 なら少しゆっくり・1.15 なら速め)。声の高さは変えない */
let ZH_AUDIO=null,curAudio=null;
fetch('./audio/zh/index.json').then(r=>r.ok?r.json():null).then(j=>{ZH_AUDIO=j;}).catch(()=>{});
function stopVoice(){if(curAudio){try{curAudio.pause();}catch(e){}curAudio.onended=null;curAudio=null;}if(hasTTS)speechSynthesis.cancel();}
function playRecorded(text,opt){
  const k=ZH_AUDIO&&ZH_AUDIO[String(text).replace(/\n/g,' ').trim()];
  if(!k)return false;
  stopVoice();
  const a=new Audio('./audio/zh/'+k+'.m4a');
  a.preservesPitch=true;a.webkitPreservesPitch=true;
  a.playbackRate=(opt.rate||RATE)/0.85;
  if(opt.onend)a.onended=opt.onend;
  curAudio=a;
  a.play().catch(()=>{if(curAudio===a){curAudio=null;speakTTS(text,opt);}});
  return true;
}
function speak(text,opt){opt=opt||{};if(playRecorded(text,opt))return;speakTTS(text,opt);}
document.getElementById('rate').addEventListener('change',e=>{RATE=parseFloat(e.target.value);});

/* ============ SRSエンジン ============ */
function schedule(st,rating){
  const s=Object.assign({iv:0,ease:2.5,reps:0,lap:0,stt:'new',due:0},st||{});
  if(s.stt==='new'||s.stt==='learn'){
    if(rating===0){s.stt='learn';s.due=today();s.reps++;return{s,requeue:true};}
    s.iv=[0,1,2,4][rating];s.stt='rev';s.reps++;s.due=today()+s.iv;return{s,requeue:false};
  }
  if(rating===0){s.lap++;s.ease=Math.max(1.3,s.ease-0.2);s.iv=1;s.stt='learn';s.reps++;s.due=today();return{s,requeue:true};}
  if(rating===1){s.iv=Math.max(s.iv+1,Math.round(s.iv*1.2));s.ease=Math.max(1.3,s.ease-0.15);}
  if(rating===2){s.iv=Math.round(s.iv*s.ease);}
  if(rating===3){s.iv=Math.round(s.iv*s.ease*1.35);s.ease=Math.min(3,s.ease+0.15);}
  s.iv=Math.min(365,Math.max(1,s.iv));s.reps++;s.due=today()+s.iv;return{s,requeue:false};
}
function previewIv(st,rating){
  const r=schedule(st?JSON.parse(JSON.stringify(st)):null,rating);
  return r.requeue?'すぐ':(r.s.iv+'日');
}
function dueIds(){return Object.keys(DB.states).filter(id=>DB.states[id].due<=today()&&byId(id));}
function unseenIds(){return ALL().filter(c=>!DB.states[c.id]).map(c=>c.id);}
function newRemainToday(){return Math.max(0,DB.newPerDay-(DB.intro[todayStr()]||0));}

/* ============ 復習タブ ============ */
let sess={q:[],pos:0,rev:false,active:false,doneCount:0};
function startSession(extraNew){
  const news=unseenIds().slice(0,extraNew?10:newRemainToday());
  sess={q:dueIds().concat(news),pos:0,rev:false,active:true,doneCount:0};
  if(extraNew&&news.length){DB.intro[todayStr()]=(DB.intro[todayStr()]||0);} 
  renderRev();
  if(sess.q.length&&DB.qmode==='listen')speak(byId(sess.q[0]).h);
}
function answer(rating){
  const id=sess.q[sess.pos];
  const fresh=!DB.states[id];
  const r=schedule(DB.states[id],rating);
  DB.states[id]=r.s;
  if(fresh)DB.intro[todayStr()]=(DB.intro[todayStr()]||0)+1;
  if(r.requeue){const re=sess.q.splice(sess.pos,1)[0];sess.q.splice(Math.min(sess.pos+3,sess.q.length),0,re);}
  else{sess.pos++;sess.doneCount++;}
  sess.rev=false;
  dbSave();
  renderRev();
  if(sess.pos<sess.q.length&&DB.qmode==='listen')speak(byId(sess.q[sess.pos]).h);
}

      <select id="npd"><option value="5"${DB.newPerDay===5?' selected':''}>新規5/日</option><option value="10"${DB.newPerDay===10?' selected':''}>新規10/日</option><option value="20"${DB.newPerDay===20?' selected':''}>新規20/日</option></select>
    </span>

  const c=el('tab-rev');

    c.innerHTML=statsHtml+(total
      ?`<button class="btn wide" id="startBtn">復習をはじめる(${total}枚)</button>`
      :`<div class="done"><div class="zh-big">完成!</div><p class="muted" style="margin-top:6px">今日のノルマは終わりです。明日また会いましょう。</p><button class="btn quiet mt12" id="moreBtn">新規カードを10枚だけ前倒しする</button></div>`);
    const sb=el('startBtn');if(sb)sb.onclick=()=>startSession(false);
    const mb=el('moreBtn');if(mb)mb.onclick=()=>startSession(true);
  }else if(sess.pos>=sess.q.length){
    sess.active=false;
    c.innerHTML=statsHtml+`<div class="done"><div class="zh-big">辛苦了!</div><p class="muted" style="margin-top:6px">${sess.doneCount}枚 完了。復習は明日以降に熟成されます。</p></div>`;
  }else{
    const id=sess.q[sess.pos];const w=byId(id);const st=DB.states[id];
    const isNew=!st||st.stt==='new'||st.stt==='learn';
    let front,ans='';

    c.innerHTML=statsHtml+`
    <div class="card">
      <div class="row between"><span class="badge ${isNew?'b-new':'b-rev'}">${isNew?'新規':'復習'}</span><span class="muted" style="font-size:.72rem">${w.t}</span></div>
      <div class="tzg-wrap"><div class="tzg">${front}</div></div>
      <div class="card-answer">${ans}</div>
      <div class="row center mt8">
        <button class="btn ghost" id="rPlay"><span class="icon-play"></span>再生</button>
        ${sess.rev?'':'<button class="btn" id="rReveal">答えを見る</button>'}
      </div>
      ${sess.rev?`<div class="rate4">
        <button class="r-again" data-r="0">もう一度<span class="iv">${previewIv(st,0)}</span></button>
        <button data-r="1">難しい<span class="iv">${previewIv(st,1)}</span></button>
        <button class="r-good" data-r="2">普通<span class="iv">${previewIv(st,2)}</span></button>
        <button class="r-easy" data-r="3">簡単<span class="iv">${previewIv(st,3)}</span></button>
      </div>`:''}
      <div class="progress">残り ${sess.q.length-sess.pos} 枚</div>
    </div>`;
    el('rPlay').onclick=()=>speak(w.h);
    const rv=el('rReveal');if(rv)rv.onclick=()=>{sess.rev=true;renderRev();if(DB.qmode==='ja')speak(w.h);};
    c.querySelectorAll('.rate4 button').forEach(b=>{b.onclick=()=>answer(+b.dataset.r);});
  }
  const qm=el('qmode');if(qm)qm.onchange=()=>{DB.qmode=qm.value;dbSave();renderRev();};
  const np=el('npd');if(np)np.onchange=()=>{DB.newPerDay=+np.value;dbSave();renderRev();};
}

/* ============ 単語管理タブ ============ */
let resetArmed=false;
function renderManage(){
  el('tab-manage').innerHTML=`
  <div class="card"><h2>検索<span class="tag">キット内ミニ辞書</span></h2>
    <input type="text" id="q" placeholder="漢字・ピンイン・日本語で検索" style="width:100%">
    <div id="qOut"></div></div>
  <div class="card"><h2>カードを追加</h2>
    <p class="muted" style="font-size:.76rem">仕事やレッスンで出会った単語をここへ。ピンインが不明なら空欄でもOK(あとでClaudeに聞いて追記)。</p>
    <div class="row mt8"><input type="text" id="aH" placeholder="漢字" style="flex:1"><input type="text" id="aP" placeholder="ピンイン" style="flex:1"></div>
    <input type="text" id="aM" placeholder="日本語の意味" style="width:100%;margin-top:8px">
    <button class="btn wide mt8" id="aGo">追加する</button><div id="aMsg"></div></div>
  <div class="card"><h2>インポート / エクスポート<span class="tag">Anki連携用</span></h2>
    <p class="muted" style="font-size:.76rem">1行1語「漢字(タブかカンマ)ピンイン(タブかカンマ)意味」。エクスポートした内容はAnki等にそのまま取り込めます。</p>
    <textarea id="ioBox" placeholder="打算,dǎsuàn,〜するつもり"></textarea>
    <div class="row mt8"><button class="btn ghost sm" id="ioExp">全カードを書き出す</button><button class="btn sm" id="ioImp">貼り付けた内容を取り込む</button></div>
    <div id="ioMsg"></div></div>
  <div class="card"><h2>進捗のリセット</h2><button class="btn red sm" id="rst">学習履歴を初期化する</button></div>`;
  el('q').oninput=()=>{
    const v=el('q').value.trim().toLowerCase();
    if(!v){el('qOut').innerHTML='';return;}
    const hits=ALL().filter(c=>(c.h+c.p+c.m).toLowerCase().includes(v)).slice(0,30);
    el('qOut').innerHTML=hits.length?hits.map(c=>`<div class="list-item"><span class="h zh">${esc(c.h)}</span><span class="p">${esc(c.p)}</span><span class="m">${esc(c.m)}</span><button class="btn ghost sm" data-s="${esc(c.h)}"><span class="icon-play"></span></button>${c.id[0]==='c'?`<button class="btn quiet sm" data-del="${c.id}">削除</button>`:''}</div>`).join(''):'<p class="muted mt8">見つかりませんでした。下のフォームから追加できます。</p>';
    el('qOut').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>speak(b.dataset.s));
    el('qOut').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{DB.custom=DB.custom.filter(c=>c.id!==b.dataset.del);delete DB.states[b.dataset.del];dbSave();el('q').oninput();});
  };
  el('aGo').onclick=()=>{
    const h=el('aH').value.trim(),p=el('aP').value.trim(),m=el('aM').value.trim();
    if(!h||!m){el('aMsg').innerHTML='<div class="err-box">漢字と意味は必須です。</div>';return;}
    DB.custom.push({id:'c'+Date.now(),h,p,m,t:'マイ単語'});dbSave();
    el('aH').value='';el('aP').value='';el('aM').value='';
    el('aMsg').innerHTML='<p class="muted mt8">追加しました。次回の「復習」から新規カードとして出題されます。</p>';
    renderRev();
  };
  el('ioExp').onclick=()=>{el('ioBox').value=ALL().map(c=>[c.h,c.p,c.m].join('\t')).join('\n');el('ioMsg').innerHTML='<p class="muted mt8">全カードを書き出しました。全選択してコピーしてください。</p>';};
  el('ioImp').onclick=()=>{
    const lines=el('ioBox').value.split('\n').map(l=>l.trim()).filter(Boolean);
    let n=0;
    lines.forEach(l=>{const a=l.split(/\t|,/).map(x=>x.trim());if(a[0]&&a.length>=2){DB.custom.push({id:'c'+Date.now()+'-'+n,h:a[0],p:a[1]||'',m:a[2]||a[1],t:'マイ単語'});n++;}});
    dbSave();el('ioMsg').innerHTML=`<p class="muted mt8">${n}枚を取り込みました。</p>`;renderRev();
  };
  el('rst').onclick=()=>{
    if(!resetArmed){resetArmed=true;el('rst').textContent='本当に初期化する(もう一度タップ)';return;}
    DB.states={};DB.intro={};resetArmed=false;dbSave();renderManage();renderRev();
  };
}

/* ============ 発音チェックタブ ============ */
const SRClass=window.SpeechRecognition||window.webkitSpeechRecognition;
let pr={idx:0,free:'',result:null,listening:false,err:''};
function norm(s){
  s=String(s).replace(/[\s,。、,.!?!?::;;・…""''「」()()~〜]/g,'');
  s=s.replace(/10/g,'十');
  const D={'0':'零','1':'一','2':'二','3':'三','4':'四','5':'五','6':'六','7':'七','8':'八','9':'九'};
  s=s.replace(/[0-9]/g,d=>D[d]);
  return s.replace(/两/g,'二');
}
function lcsFlags(t,h){
  const n=t.length,m=h.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)dp[i][j]=t[i-1]===h[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  const flags=new Array(n).fill(false);let i=n,j=m;
  while(i>0&&j>0){if(t[i-1]===h[j-1]){flags[i-1]=true;i--;j--;}else if(dp[i-1][j]>=dp[i][j-1])i--;else j--;}
  return flags;
}
function prTarget(){return pr.idx<0?pr.free:PHRASES[pr.idx].c;}
function renderPron(){
  const supported=!!SRClass;
  const t=prTarget();
  let resHtml='';
  if(pr.err)resHtml=`<div class="err-box">${esc(pr.err)}</div>`;
  else if(pr.result!==null){
    const tn=norm(t),hn=norm(pr.result);
    const flags=lcsFlags(tn.split(''),hn.split(''));
    const ok=flags.filter(Boolean).length;
    const score=tn.length?Math.round(ok/tn.length*100):0;
    const verdict=score>=90?'◎ 通じる発音です!':score>=70?'○ 惜しい!赤い字を重点練習':'△ お手本をもう一度聞いてから再挑戦';
    resHtml=`<div class="diff zh mt12">${tn.split('').map((ch,i)=>`<span class="${flags[i]?'ok':'ng'}">${esc(ch)}</span>`).join('')}</div>
    <div class="scoreline">${score}点 ── ${verdict}</div>
    <div class="heard">認識結果:${esc(pr.result)||'(無音)'}</div>`;
  }
  el('tab-pron').innerHTML=`
  <div class="card"><h2>発音チェック<span class="tag">音声認識で通じ度テスト</span></h2>
    <p class="muted" style="font-size:.78rem">スマホの中国語音声認識に話しかけ、<b>正しく文字化されるか</b>で「通じる発音か」を判定します。声調が崩れると別の字になるので、実用的な近似テストになります。</p>
    ${supported?'':'<div class="err-box">この環境では音声認識が使えません。ホスティング版(ホーム画面のアプリ)や、ChromeまたはSafariで開くと使えます。マイク許可とネット接続が必要です。</div>'}
    <div class="row mt12"><select id="prSel" style="flex:1">${PHRASES.map((p,i)=>`<option value="${i}"${i===pr.idx?' selected':''}>${p.c}</option>`).join('')}<option value="-1"${pr.idx<0?' selected':''}>(自由入力)</option></select></div>
    ${pr.idx<0?`<input type="text" id="prFree" placeholder="練習したい中国語を入力" value="${esc(pr.free)}" style="width:100%;margin-top:8px">`:''}
    <div style="text-align:center;margin-top:14px">
      <div class="zh" style="font-size:1.5rem;font-weight:700;line-height:1.7">${esc(t)||'―'}</div>
      ${pr.idx>=0?`<div class="pinyin">${esc(PHRASES[pr.idx].p)}</div>`:''}
      <button class="btn ghost sm mt8" id="prHear"><span class="icon-play"></span>お手本を聞く</button>
    </div>
    <button class="rec-btn${pr.listening?' listening':''}" id="prRec" ${supported?'':'disabled'}>${pr.listening?'認識中…':'話す'}</button>
    <p class="muted" style="text-align:center;font-size:.72rem">タップ → お手本の文を発音</p>
    ${resHtml}
    <div class="note">判定できるのは「通じるか」まで。声調の美しさ・自然さの仕上げは、週1回のオンラインレッスンで人間に見てもらってください。数字の表記ゆれ(十↔10など)は自動で吸収します。</div>
  </div>`;
  el('prSel').onchange=e=>{pr.idx=+e.target.value;pr.result=null;pr.err='';renderPron();};
  const pf=el('prFree');if(pf)pf.onchange=()=>{pr.free=pf.value.trim();pr.result=null;renderPron();};
  el('prHear').onclick=()=>{if(prTarget())speak(prTarget());};
  el('prRec').onclick=()=>{
    if(!SRClass||pr.listening)return;
    if(!prTarget()){pr.err='まず文を選ぶか入力してください。';renderPron();return;}
    pr.err='';pr.result=null;pr.listening=true;renderPron();
    try{
      const r=new SRClass();
      r.lang='zh-CN';r.interimResults=false;r.maxAlternatives=1;
      r.onresult=e=>{pr.result=e.results[0][0].transcript;};
      r.onerror=e=>{
        const map={'not-allowed':'マイクの使用が許可されていません。ブラウザ設定でマイクを許可してください。','no-speech':'音声が検出されませんでした。もう少し大きな声でどうぞ。','network':'音声認識にはネット接続が必要です。','audio-capture':'マイクが見つかりませんでした。'};
        pr.err=map[e.error]||('認識エラー:'+e.error+'。この環境では使えない可能性があります。');
      };
      r.onend=()=>{pr.listening=false;renderPron();};
      r.start();
    }catch(e){pr.listening=false;pr.err='この環境では音声認識を開始できませんでした。ホスティング版かブラウザでお試しください。';renderPron();}
  };
}

/* ============ 初期化 ============ */
(async()=>{
  await storeInit();
  DB=(await dbLoad())||{ver:1,newPerDay:10,qmode:'listen',states:{},custom:[],intro:{}};
  const seg=el('mainSeg');
  seg.addEventListener('click',e=>{
    const b=e.target.closest('button[data-p]');if(!b)return;
    stopVoice();
    seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    ['rev','manage','pron'].forEach(k=>{el('tab-'+k).style.display=(k===b.dataset.p)?'block':'none';});
  });
  ['manage','pron'].forEach(k=>el('tab-'+k).style.display='none');
  renderRev();renderManage();renderPron();
})();
</script>
